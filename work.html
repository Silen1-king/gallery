<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>作品 | Silen1 的画室</title>
  <meta name="theme-color" content="#F2EFE8">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Silen1 的画室">
  <meta property="og:image" content="https://silen1.com/gallery/assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="work">
  <a class="skip" href="#piece">跳到作品</a>

  <header class="bar" id="bar">
    <a class="mark" href="./"><span class="seal" aria-hidden="true">画</span><span class="mark__name">Silen1 <span class="mark__sub">的画室</span></span></a>
    <nav class="bar__nav" aria-label="主导航">
      <a href="./#hall">展厅</a>
      <a href="./#catalog">清单</a>
      <a href="collection.html">藏室</a>
      <a href="./#about">关于</a>
      <a class="bar__out" href="https://silen1.com/">出馆<i aria-hidden="true">↗</i></a>
    </nav>
  </header>

  <main class="piece" id="piece">
    <div class="piece__wall">
      <a class="frame piece__art" id="piece-art" target="_blank" rel="noopener"></a>
    </div>

    <aside class="piece__info">
      <div class="label label--lg" id="piece-label"><h1 class="label__title">作品</h1></div>
      <p class="piece__notes" id="piece-notes"></p>
      <dl class="piece__meta" id="piece-meta"></dl>
      <p class="piece__full"><a id="piece-full" target="_blank" rel="noopener">查看原图<i aria-hidden="true">↗</i></a></p>
    </aside>

    <section class="player" id="player" hidden aria-labelledby="player-heading">
      <h2 id="player-heading">绘画过程</h2>
      <div class="player__screen" id="player-screen"></div>
      <div class="player__controls">
        <button class="player__btn" id="player-btn" type="button">播放</button>
        <input class="player__range" id="player-range" type="range" min="0" max="1000" value="0" step="1" aria-label="回放进度">
        <span class="player__time" id="player-time">00:00</span>
      </div>
    </section>

    <nav class="pager" aria-label="上一件和下一件">
      <a class="pager__link pager__prev" id="pager-prev" hidden></a>
      <a class="pager__back" href="./#catalog">全部展品</a>
      <a class="pager__link pager__next" id="pager-next" hidden></a>
    </nav>
  </main>

  <p class="empty empty--page" id="piece-missing" hidden>找不到这幅画。它可能改了名字，<a href="./#catalog">回到作品目录</a>看看。</p>

  <footer class="foot">
    <p>© Silen1　作品版权归 Silen1 所有，转载或使用请先联系我。</p>
    <p class="foot__home"><a href="https://silen1.com/">← 回到 silen1.com</a></p>
  </footer>

  <script src="data/works.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
